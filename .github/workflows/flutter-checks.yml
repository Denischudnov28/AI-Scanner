name: Flutter checks

concurrency:
  group: ai-scanner-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate native platform projects
        run: flutter create --platforms=android,ios --project-name ai_scanner .
      - name: Configure native biometric authentication
        run: python3 tool/configure_platform_auth.py
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos

  android-build:
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project
        run: flutter create --platforms=android --project-name ai_scanner .
      - name: Configure native biometric authentication
        run: python3 tool/configure_platform_auth.py
      - name: Install dependencies
        run: flutter pub get
      - name: Build Android APK
        run: flutter build apk --debug

  ios-build:
    runs-on: macos-latest
    needs: analyze
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate iOS project
        run: flutter create --platforms=ios --project-name ai_scanner .
      - name: Configure native biometric authentication
        run: python3 tool/configure_platform_auth.py
      - name: Install dependencies
        run: flutter pub get
      - name: Build iOS simulator app
        run: flutter build ios --simulator --no-codesign
