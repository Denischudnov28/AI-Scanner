name: Flutter checks

concurrency:
  group: ai-scanner-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate native platform projects
        run: flutter create --platforms=android,ios --project-name ai_scanner .
      - name: Configure native biometric authentication and OCR
        run: python3 tool/configure_platform_auth.py
      - name: Add offline Russian OCR model
        run: |
          mkdir -p android/app/src/main/assets/tessdata
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/rus.traineddata \
            --output android/app/src/main/assets/tessdata/rus.traineddata
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Run widget tests
        run: flutter test

  android-build:
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project
        run: flutter create --platforms=android --project-name ai_scanner .
      - name: Configure native biometric authentication
        run: python3 tool/configure_platform_auth.py
      - name: Install dependencies
        run: flutter pub get
      - name: Build Android APK
        run: flutter build apk --debug
      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Scanner-Android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  ios-build:
    runs-on: macos-latest
    needs: analyze
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate iOS project
        run: flutter create --platforms=ios --project-name ai_scanner .
      - name: Configure native biometric authentication
        run: python3 tool/configure_platform_auth.py
      - name: Install dependencies
        run: flutter pub get
      - name: Build iOS simulator app
        run: flutter build ios --simulator --no-codesign
      - name: Package iOS simulator app
        run: ditto -c -k --sequesterRsrc --keepParent build/ios/iphonesimulator/Runner.app AI-Scanner-iOS-Simulator.zip
      - name: Upload iOS simulator build
        uses: actions/upload-artifact@v4
        with:
          name: AI-Scanner-iOS-Simulator
          path: AI-Scanner-iOS-Simulator.zip
          if-no-files-found: error
