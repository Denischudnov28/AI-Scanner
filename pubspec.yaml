name: ai_scanner
description: Privacy-first document scanner prototype.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.1'

dependencies:
  flutter:
    sdk: flutter
  image_picker: ^1.1.2
  pdf: ^3.11.1
  path_provider: ^2.1.5
  share_plus: ^13.3.1
  cross_file: ^0.3.4+2
  flutter_native_ocr: ^0.1.0
  file_picker: ^13.3.3
  pdfx: ^2.11.0
  document_scan: ^0.5.0
  cryptography: ^2.7.0
  flutter_secure_storage: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
